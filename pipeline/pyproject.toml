[project]
name = "arxiv-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "feedparser>=6.0",
    "requests>=2.32",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arxiv-pipeline = "arxiv_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arxiv_pipeline*"]
